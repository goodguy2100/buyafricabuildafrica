name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun x @tanstack/router-cli generate

      - name: Build
        run: bun run build

      - name: Generate index.html with real asset hashes
        run: |
          # The build (TanStack Start + nitro) outputs client assets to .output/public/assets
          # Entry JS = the bundle that contains __vite__mapDeps (all other chunks import from it)
          JS=$(grep -l "__vite__mapDeps" .output/public/assets/index-*.js | head -1 | xargs basename)
          if [ -z "$JS" ]; then
            JS=$(ls -S .output/public/assets/index-*.js | head -1 | xargs basename)
          fi
          CSS=$(ls .output/public/assets/styles-*.css | head -1 | xargs basename)
          echo "JS=$JS CSS=$CSS"

          # Custom domain serves at root -> root-relative /assets/ paths are correct.
          cat > .output/public/index.html << HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Buy Africa Build Africa (BABA) | Connecting Local Talent to Continental Opportunity</title>
            <meta name="description" content="A Pan-African platform connecting professionals, artisans, institutions, and opportunities to drive economic growth and sustainable development across Africa." />
            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
            <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
            <link rel="stylesheet" href="/assets/${CSS}" />
          </head>
          <body>
            <div id="root"></div>
            <script type="module" crossorigin src="/assets/${JS}"></script>
          </body>
          </html>
          HTML
          echo "--- index.html ---"
          cat .output/public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
